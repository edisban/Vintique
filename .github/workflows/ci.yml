name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # CI: every push and pull request is linted, type-checked, tested and built
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintique-next

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vintique
          POSTGRES_PASSWORD: vintique
          POSTGRES_DB: vintique
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vintique"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vintique-next/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder-not-used-at-runtime

  # CD: after CI passes on master, publish the production Docker image to GitHub Container Registry
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase, but the repository is named "Vintique"
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: vintique-next
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
