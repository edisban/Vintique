version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vintique
      POSTGRES_PASSWORD: vintique
      POSTGRES_DB: vintique
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: ./vintique-next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vintique:vintique@db:5432/vintique
      JWT_SECRET: dev-secret-change-me
    depends_on:
      - db
volumes:
  pgdata:
