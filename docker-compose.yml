services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vintique
      POSTGRES_PASSWORD: vintique
      POSTGRES_DB: vintique
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vintique -d vintique"]
      interval: 2s
      timeout: 5s
      retries: 15
  app:
    build: ./vintique-next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vintique:vintique@db:5432/vintique
      # Set these in the root .env file (see README)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vintique.com}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
